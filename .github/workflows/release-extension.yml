name: Release extension zip

on:
  push:
    branches:
      - develop
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: extension-release
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish extension releases
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: sidebar/package-lock.json

      - name: Build AI sidebar
        working-directory: sidebar
        run: |
          npm ci
          npm run build

      - name: Install zip
        run: |
          sudo apt-get update
          sudo apt-get install -y zip

      - name: Package extension
        id: package
        shell: bash
        run: |
          VERSION="$(node -p "require('./manifest.json').version")"
          SHORT_SHA="$(git rev-parse --short HEAD)"
          RELEASE_TAG="release-${SHORT_SHA}"
          RELEASE_ZIP_NAME="adblock-extension-v${VERSION}-${SHORT_SHA}.zip"
          LATEST_ZIP_NAME="adblock-extension-latest.zip"
          STAGING_DIR="$(mktemp -d)"
          EXT_DIR="$STAGING_DIR/adblock-extension"

          mkdir -p "$EXT_DIR"

          for path in \
            manifest.json \
            background.js \
            content.js \
            ai-content.js \
            blacklist.json \
            icons \
            blocking \
            fullpage-capture \
            phishing-alert \
            pip \
            popup \
            rules \
            sidebar/dist \
            studocu \
            study-blocker
          do
            cp -R "$path" "$EXT_DIR/"
          done

          (cd "$STAGING_DIR" && zip -qr "$GITHUB_WORKSPACE/$RELEASE_ZIP_NAME" adblock-extension)
          cp "$GITHUB_WORKSPACE/$RELEASE_ZIP_NAME" "$GITHUB_WORKSPACE/$LATEST_ZIP_NAME"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "release_zip_name=$RELEASE_ZIP_NAME" >> "$GITHUB_OUTPUT"
          echo "latest_zip_name=$LATEST_ZIP_NAME" >> "$GITHUB_OUTPUT"

      - name: Create commit release tag
        env:
          RELEASE_TAG: ${{ steps.package.outputs.release_tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if ! git rev-parse "$RELEASE_TAG" >/dev/null 2>&1; then
            git tag "$RELEASE_TAG" "$GITHUB_SHA"
            git push origin "refs/tags/$RELEASE_TAG"
          fi

      - name: Create or update commit release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.package.outputs.release_tag }}
          RELEASE_ZIP_NAME: ${{ steps.package.outputs.release_zip_name }}
          VERSION: ${{ steps.package.outputs.version }}
          SHORT_SHA: ${{ steps.package.outputs.short_sha }}
        run: |
          NOTES="Automatic extension build from commit ${GITHUB_SHA} (manifest v${VERSION}, ${SHORT_SHA}). Download ${RELEASE_ZIP_NAME}, extract it, then load the extracted adblock-extension folder in Chrome."

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" \
              --title "AdBlock Extension ${SHORT_SHA}" \
              --notes "$NOTES"
          else
            gh release create "$RELEASE_TAG" \
              --title "AdBlock Extension ${SHORT_SHA}" \
              --notes "$NOTES"
          fi

          gh release upload "$RELEASE_TAG" "$RELEASE_ZIP_NAME" --clobber

      - name: Move latest tag to this commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f latest "$GITHUB_SHA"
          git push --force origin refs/tags/latest

      - name: Create or update latest release
        env:
          GH_TOKEN: ${{ github.token }}
          LATEST_ZIP_NAME: ${{ steps.package.outputs.latest_zip_name }}
          VERSION: ${{ steps.package.outputs.version }}
          SHORT_SHA: ${{ steps.package.outputs.short_sha }}
        run: |
          NOTES="Automatic extension build from commit ${GITHUB_SHA} (manifest v${VERSION}, ${SHORT_SHA}). Download ${LATEST_ZIP_NAME}, extract it, then load the extracted adblock-extension folder in Chrome."

          if gh release view latest >/dev/null 2>&1; then
            gh release edit latest \
              --title "Latest AdBlock Extension" \
              --notes "$NOTES"
          else
            gh release create latest \
              --title "Latest AdBlock Extension" \
              --notes "$NOTES"
          fi

          gh release upload latest "$LATEST_ZIP_NAME" --clobber
